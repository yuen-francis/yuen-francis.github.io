# =========================================================
# Site settings
# =========================================================
defaults:
  # For all posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      classes: wide
  # For all pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      classes: wide

title: "Francis Yuen"
name: "Francis Yuen"

description: "PhD Student in Developmental Psychology at The University of British Columbia"

url: "https://yuen-francis.github.io"
baseurl: ""

repository: "yuen-francis/yuen-francis.github.io"


# =========================================================
# Theme
# =========================================================

remote_theme: "mmistakes/minimal-mistakes"


# =========================================================
# Plugins
# =========================================================

plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-seo-tag


# =========================================================
# Minimal Mistakes skin
# =========================================================

minimal_mistakes_skin: "default"


# =========================================================
# Author
# =========================================================

author:
  name: "Francis Yuen"

  avatar: "/assets/images/profile.jpg"

  bio: "PhD Student | Developmental Psychology, The University of British Columbia"

  location: "Vancouver, British Columbia"

  links:

    - label: "University of British Columbia"
      icon: "fas fa-fw fa-university"
      url: "https://psych.ubc.ca/profile/francis-yuen/"

    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:yfrancis0119@gmail.com"

    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=h-MUIzsAAAAJ&hl=en"

    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0001-7570-123X"


# =========================================================
# Navigation
# =========================================================

include:
  - _pages


# =========================================================
# Reading
# =========================================================

read_more: "disabled"


# =========================================================
# Markdown
# =========================================================

markdown: kramdown

kramdown:
  input: GFM
  hard_wrap: false


# =========================================================
# Permalinks
# =========================================================

permalink: /:categories/:title/


# =========================================================
# Collections
# =========================================================

collections:

  research:
    output: true

    permalink: /research/:path/


# =========================================================
# Defaults
# =========================================================

defaults:

  # -------------------------
  # Pages
  # -------------------------

  - scope:
      path: ""
      type: pages

    values:
      layout: single
      author_profile: true


  # -------------------------
  # Research
  # -------------------------

  - scope:
      path: ""
      type: research

    values:
      layout: single
      author_profile: true


# =========================================================
# Footer
# =========================================================

footer:
  links:

    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=h-MUIzsAAAAJ&hl=en"

    - label: "ORCID"
      icon: "fab fa-fw fa-orcid"
      url: "https://orcid.org/0000-0001-7570-123X"
