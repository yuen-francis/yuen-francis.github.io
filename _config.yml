# Site settings
title: "Francis Yuen"
name: "Francis Yuen"
description: "Developmental Psychologist"
url: "https://yuen-francis.github.io"
baseurl: ""

# Theme
remote_theme: "mmistakes/minimal-mistakes@4.28.1"

# Skin
minimal_mistakes_skin: "air"

# Plugins
plugins:
  - jekyll-include-cache

# Site author
author:
  name: "Francis Yuen"
  avatar: "/assets/images/profile.jpg"
  bio: "Developmental Psychologist"
  location: "Montreal, Quebec"

  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:yfrancis0119@gmail.com"

    - label: "Google Scholar"
      icon: "fas fa-fw fa-graduation-cap"
      url: "https://scholar.google.com/citations?user=h-MUIzsAAAAJ&hl=en"

# Navigation
include:
  - _pages

# Reading
read_more: "disabled"

# Output
permalink: /:categories/:title/

# Markdown
markdown: kramdown

# Collections
collections:
  research:
    output: true
    permalink: /research/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
